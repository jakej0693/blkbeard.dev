<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLKBEARD</title>
  <link rel="icon" type="image/jpeg" href="blklogo.jpg" />
  <link rel="apple-touch-icon" href="blklogo.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --border: #222;
      --text: #e8e8e8;
      --muted: #666;
      --accent: #B31212;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    /* Layout */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 2rem;
      width: 100%;
    }

    /* Header */
    header {
      padding: 4rem 0 3rem;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.6s ease both;
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px dashed var(--border);
      margin: 0 auto 1.5rem;
      overflow: hidden;
      position: relative;
      object-fit: cover;
    }

    .tag {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
      display: block;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      font-size: clamp(4rem, 12vw, 7rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
    }

    /* About */
    .about {
      padding: 3.5rem 0;
      animation: fadeUp 0.6s 0.15s ease both;
      text-align: center;
    }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .about p {
      font-size: 1rem;
      line-height: 1.8;
      color: #aaa;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    .about p + p {
      margin-top: 1.2rem;
    }

    /* Footer */
    footer {
      margin-top: auto;
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      animation: fadeUp 0.6s 0.3s ease both;
    }

    footer .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    footer span {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .social-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .social-links a {
      font-size: 0.72rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    .social-links a:hover {
      color: var(--accent);
    }

    /* Animation */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Mobile */
    @media (max-width: 480px) {
      header { padding: 2.5rem 0 2rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img class="avatar" src="blklogo.jpg" alt="BLKBEARD" />
      <span class="tag">Find me on Twitch &amp; Steam</span>
      <h1>BLK<span>BEARD</span></h1>
    </header>

    <section class="about">
      <div class="section-label">About</div>
      <p>
        What's Up?! I'm Spence AKA BLKBEARD, you can catch me gaming, chillin, or doing various dev work. It's my birthday today!
      </p>
      <p>
        Hit me up on the platforms below.
      </p>
    </section>
  </div>

  <footer>
    <div class="container">
      <span>&copy; 2026 BLKBEARD</span>
      <div class="social-links">
        <a href="#" target="_blank" rel="noopener noreferrer">Discord</a>
        <a href="https://open.spotify.com/user/elqxxqaig2rzo7ysdu7b9uf1q" target="_blank" rel="noopener noreferrer">Spotify</a>
        <a href="https://steamcommunity.com/profiles/76561198217378477" target="_blank" rel="noopener noreferrer">Steam</a>
        <a href="https://medal.tv/u/BLKBEARD?invite=ur-MSw5NXQsNDc3NjU0MDU4" target="_blank" rel="noopener noreferrer">Medal</a>
        <a href="https://www.twitch.tv/blkbeard_tv" target="_blank" rel="noopener noreferrer">Twitch</a>
        <a href="https://www.youtube.com/channel/UCNf5Ms3ASnQKTMDztCVWJlg" target="_blank" rel="noopener noreferrer">YouTube</a>
      </div>
    </div>
  </footer>

</body>
</html>
