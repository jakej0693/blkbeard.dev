<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Friend's Name] — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f8fa;
    --ink: #14171a;
    --muted: #5b6472;
    --accent: #3b49df;
    --border: #e3e5ea;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --sans: 'Inter', -apple-system, system-ui, sans-serif;
    --display: 'Space Grotesk', var(--sans);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  main.wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 4rem 1.5rem;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 1rem;
  }

  h1.name {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2.25rem, 6vw, 3.75rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 0.75rem;
  }

  p.tagline {
    font-family: var(--mono);
    font-size: 1.05rem;
    color: var(--muted);
    margin: 0 0 2rem;
  }

  .cursor {
    display: inline-block;
    color: var(--accent);
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  p.bio {
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--ink);
    max-width: 54ch;
    margin: 0 0 2.5rem;
  }

  nav.links {
    display: flex;
    flex-wrap: wrap;
    gap: 0 1.5rem;
    padding-top: 1.75rem;
    border-top: 1px solid var(--border);
  }

  nav.links a {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--ink);
    text-decoration: none;
    padding: 0.25rem 0;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  nav.links a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  footer {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    padding: 1.5rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Tech Portfolio</p>
    <h1 class="name">[Friend's Name]</h1>
    <p class="tagline">[Role or focus — e.g. Backend Engineer]<span class="cursor">_</span></p>
    <p class="bio">
      [Two or three sentences: what he works on, what he's into, and something he's currently building or learning. Keep it short — this is a first impression, not a resume.]
    </p>
    <nav class="links">
      <a href="https://github.com/username" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://linkedin.com/in/username" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://x.com/username" target="_blank" rel="noopener noreferrer">X</a>
      <a href="mailto:name@example.dev">Email</a>
    </nav>
  </main>
  <footer>
    <span>[City]</span> · <span id="year"></span>
  </footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
